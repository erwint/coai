version: 2
project_name: coai
builds:
  - id: coai
    main: .
    binary: coai
    flags: ["-trimpath"]
    ldflags: ["-s -w"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  draft: false
  prerelease: auto
